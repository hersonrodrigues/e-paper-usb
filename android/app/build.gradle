plugins { id 'com.android.application' }

android {
    namespace 'com.santos.epaperusb'
    compileSdk 36
    defaultConfig {
        applicationId 'com.santos.epaperusb'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.2.0'
        // Library-only translations must not outrank a language the app actually supports.
        resourceConfigurations += ['en', 'pt', 'pt-rBR', 'es', 'fr', 'it', 'de', 'ko', 'ja', 'hi', 'b+zh+Hans', 'b+zh+Hant', 'ar', 'bn', 'ru', 'in', 'tr', 'vi', 'th', 'ur', 'fa', 'pl', 'nl', 'uk', 'ta']
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    testOptions { unitTests.includeAndroidResources = true }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.10.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'com.github.mik3y:usb-serial-for-android:3.11.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
